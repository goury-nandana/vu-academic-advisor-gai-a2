name: Python and frontend checks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py course_data.py advisor_guardrails.py upload_support.py benchmark_runner.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v

  frontend-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install knowledge exporter dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Export VU academic knowledge for the web API
        run: python ../scripts/export_frontend_knowledge.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm CLI (work around npm 10 Arborist peer-resolution crash)
        run: |
          npm install --global npm@11.21.2
          test "$(npm --version)" = "11.21.2"
      - name: Resolve frontend dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install frontend dependencies
        run: npm ci
      - name: Report npm dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log("npm audit counts:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,item] of Object.entries(a.vulnerabilities ?? {})) { const via=(item.via ?? []).map(v => typeof v === "string" ? v : {title:v.title,url:v.url,range:v.range,severity:v.severity}); console.log(name + " | " + item.severity + " | direct=" + item.isDirect + " | range=" + item.range + " | fix=" + JSON.stringify(item.fixAvailable) + " | via=" + JSON.stringify(via)); }'
      - name: Run frontend regression tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run ESLint
        run: npm run lint
      - name: Build Next.js frontend
        run: npm run build
      - name: Upload generated data and lockfile for the commit job
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-frontend-files
          path: |
            frontend/package-lock.json
            frontend/data/vu-academic-knowledge.json
          if-no-files-found: error
          retention-days: 1

  commit-generated-files:
    needs: frontend-checks
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-frontend-files
          path: artifact-files
      - name: Commit generated knowledge and lockfile changes
        run: |
          git fetch origin main
          git reset --hard origin/main
          cp artifact-files/package-lock.json frontend/package-lock.json
          cp artifact-files/data/vu-academic-knowledge.json frontend/data/vu-academic-knowledge.json
          git add frontend/package-lock.json frontend/data/vu-academic-knowledge.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Export VU academic knowledge and update frontend lockfile"
            git push origin HEAD:main
          fi
